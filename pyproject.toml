[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-risk-engine"
version = "0.2.0"
description = "Financial sentiment and risk modeling platform for hedge-fund analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "dvclive>=3.0.0",
    "dvc>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
market = [
    "yfinance>=0.2.0",
]
notebook = [
    "pandas>=2.0.0",
    "jupyterlab>=3.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.0.0",
    "yfinance>=0.2.0",
    "arch>=5.0.0",
    "hmmlearn>=0.2.8",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "plotly>=5.0.0",
    "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
