[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-risk-engine"
version = "0.5.0"
description = "Financial sentiment and risk modeling platform for hedge-fund analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.20.0",
    "pyarrow>=15.0.0",
    "numpy>=1.24.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "dvclive>=3.0.0",
    "dvc>=3.0.0",
    "plotly>=5.0.0",
    "typer>=0.12.0",
]

[project.scripts]
aqre = "src.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
market = [
    "yfinance>=1.3.0",
    "curl_cffi>=0.15.0",
]
risk = [
    "scipy>=1.10.0",
    "arch>=5.0.0",
    "hmmlearn>=0.2.8",
]
research = [
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
]
dashboard = [
    "streamlit>=1.30.0",
]
platform = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
notebook = [
    "pandas>=2.0.0",
    "jupyterlab>=3.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.0.0",
    "yfinance>=0.2.0",
    "arch>=5.0.0",
    "hmmlearn>=0.2.8",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "plotly>=5.0.0",
    "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
