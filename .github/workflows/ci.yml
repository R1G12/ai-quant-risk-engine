name: CI

on:
  push:
    branches: [main, master, Romain_Phase_1]
  pull_request:
    branches: [main, master]

jobs:
  test-and-pipeline:
    runs-on: ubuntu-latest
    env:
      MARKET_SOURCE: sample

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: DVC repro Phase 1
        run: dvc repro ingest preprocess

      - name: DVC repro Phase 2 sample pipeline
        run: |
          dvc repro ingest_market_data clean_market_data generate_returns
          dvc repro generate_volatility_features generate_technical_features
          dvc repro generate_sentiment_features merge_features --force
