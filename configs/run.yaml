# Canonical run profile — edit this file to configure a full pipeline run.
# Apply with: aqre prepare && aqre run profile
# CI continues to use MARKET_SOURCE=sample via .github/workflows/ci.yml

mode: live  # demo | live

market:
  tickers: ["NVDA", "^GSPC", "CVX", "GLD", "QQQ", "SMH", "XLE", "XOM"]
  use_rolling_window: true
  rolling_days: 365

portfolio:
  weighting: optimised  # equal | manual | partial | optimised
  allow_shorts: true
  max_gross_per_ticker: 0.5
  position_sides: {"NVDA": "short", "^GSPC": "short", "CVX": "long", "GLD": "long", "QQQ": "short", "SMH": "short", "XLE": "long", "XOM": "long"}
  manual_weights: {}
  anchor_weights:
  risk_free: 0.03
  # min_gross_divisor: 5
  sentiment_position_sides: true
  sentiment_sides_window_days: 30
  sentiment_mu_blend: 0.3
  sentiment_mu_mode: vol_scaled
  sentiment_mu_scale: 0.5
  sentiment_magnitude_tilt: true
  sentiment_tilt_beta: 0.2
  sentiment_tilt_cap: 2.0
  # Trailing stops (Signals dashboard + sentiment long/short bands)
  trailing_stops:
    bull_threshold: 0.3
    bear_threshold: -0.3
    bull:
      levels: [-0.04, -0.06, -0.09]
      fractions: [0.333333, 0.333333, 0.333333]
    neutral:
      levels: [-0.02, -0.04, -0.06]
      fractions: [0.333333, 0.333333, 0.333333]
    bear:
      levels: [-0.01, -0.03, -0.05]
      fractions: [0.333333, 0.333333, 0.333333]
    use_manual: false
    manual:
      levels: [-0.02, -0.04, -0.06]
      fractions: [0.333333, 0.333333, 0.333333]

research:
  backtest_weight_source: max_sharpe
