# Canonical run profile — edit this file to configure a full pipeline run.
# Apply with: aqre prepare && aqre run profile
# CI continues to use MARKET_SOURCE=sample via .github/workflows/ci.yml

mode: live  # demo | live (takes more time, but takes real live data).

market:
  tickers: [SMH, MSFT, NVDA, USO, IWM, BABA, PDD]
  use_rolling_window: true
  rolling_days: 1095  # ~3 years (end=today, start=today-rolling_days)

portfolio:
  weighting: optimised  # equal | manual | partial | optimised
  allow_shorts: true
  max_gross_per_ticker: 0.5
  position_sides: {}  # explicit long/short overrides FinBERT sides when set
  sentiment_position_sides: true   # short if 30d score <= -0.3 (bear), long if >= 0.3
  sentiment_sides_window_days: 30
  sentiment_mu_blend: 0.3          # blend hist + FinBERT expected returns (optimised/partial)
  sentiment_mu_mode: vol_scaled    # vol_scaled | fixed
  sentiment_mu_scale: 0.5
  sentiment_mu_window_days: 30
  sentiment_magnitude_tilt: true
  sentiment_tilt_beta: 0.2
  sentiment_tilt_cap: 2.0
  regime_sentiment_mix:
    low: 0.4
    mid: 0.75
    high: 1.0
  manual_weights: {}
  anchor_weights:
  risk_free: 0.03
  # min_gross_per_ticker = 1 / (min_gross_divisor * n_tickers); default divisor 5
  # min_gross_divisor: 5

research:
  backtest_weight_source: max_sharpe
